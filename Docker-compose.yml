services:
  db:
    image: pgvector/pgvector:pg18
    container_name: db
    environment:
      - POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: personal_ai_migrate
    command: alembic -c app/alembic.ini upgrade head
    environment:
      - DB__POSTGRES_HOST=${DB__POSTGRES_HOST:-db}
      - DB__POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - DB__POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
      - DB__POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - DB__POSTGRES_PORT=${DB__POSTGRES_PORT:-5432}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: personal_ai_backend
    ports:
      - "8000:8000"
    environment:
      - DB__POSTGRES_HOST=${DB__POSTGRES_HOST:-db}
      - DB__POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - DB__POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
      - DB__POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - DB__POSTGRES_PORT=${DB__POSTGRES_PORT:-5432}
      - REDIS__HOST=${REDIS__HOST:-redis}
      - HOST__HOST=0.0.0.0
      - HOST__PORT=8000
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: personal_ai_worker
    entrypoint: taskiq worker app.tasks.broker_taskiq:broker
    environment:
      - PYTHONPATH=/app
      - DB__POSTGRES_HOST=${DB__POSTGRES_HOST:-db}
      - DB__POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - DB__POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
      - DB__POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - DB__POSTGRES_PORT=${DB__POSTGRES_PORT:-5432}
      - REDIS__HOST=${REDIS__HOST:-redis}
      - KNOWLEDGE__ENABLED=${KNOWLEDGE__ENABLED:-true}
      - KNOWLEDGE__GRPC_TARGET=knowledge:50051
      - KNOWLEDGE__TOP_K=${KNOWLEDGE__TOP_K:-3}
      - OLLAMA_LLM__BASE_URL=${OLLAMA_LLM__BASE_URL:-http://host.docker.internal:11434/v1}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_started
      knowledge:
        condition: service_started

  knowledge:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: personal_ai_knowledge
    command: python -m knowledge_services
    environment:
      - PYTHONPATH=/app
      - DB__POSTGRES_HOST=db
      - DB__POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - DB__POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
      - DB__POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - DB__POSTGRES_PORT=${DB__POSTGRES_PORT:-5432}
      - RUN__GRPC_PORT=${RUN__GRPC_PORT:-50051}
      - RAG__OLLAMA_BASE_URL=http://host.docker.internal:11434
      - RAG__EMBED_MODEL=${RAG__EMBED_MODEL:-nomic-embed-text}
    env_file:
      - path: .env
        required: false
    ports:
      - "${RUN__GRPC_PORT:-50051}:${RUN__GRPC_PORT:-50051}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  bot:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: personal_ai_bot
    entrypoint: python -m app.bot
    environment:
      - TELEGRAM__API_BASE_URL=${TELEGRAM__API_BASE_URL:-http://backend:8000}
    env_file:
      - path: .env
        required: false
    depends_on:
      backend:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
