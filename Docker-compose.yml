services:
  db:
    image: postgres:18.4-alpine
    container_name: db
    environment:
      - POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: personal_ai_migrate
    command: alembic -c app/alembic.ini upgrade head
    environment:
      - DB__POSTGRES_HOST=${DB__POSTGRES_HOST:-db}
      - DB__POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - DB__POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
      - DB__POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - DB__POSTGRES_PORT=${DB__POSTGRES_PORT:-5432}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: personal_ai_backend
    ports:
      - "8000:8000"
    environment:
      - DB__POSTGRES_HOST=${DB__POSTGRES_HOST:-db}
      - DB__POSTGRES_USER=${DB__POSTGRES_USER:-postgres}
      - DB__POSTGRES_PASSWORD=${DB__POSTGRES_PASSWORD:-secret}
      - DB__POSTGRES_DB=${DB__POSTGRES_DB:-postgres}
      - DB__POSTGRES_PORT=${DB__POSTGRES_PORT:-5432}
      - HOST__HOST=0.0.0.0
      - HOST__PORT=8000
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
