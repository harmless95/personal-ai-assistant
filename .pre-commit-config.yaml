repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        exclude: ^knowledge_services/grpc_gen/

      - id: mypy-check
        name: mypy check
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]

